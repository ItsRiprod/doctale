# Cloudflare Workers Static Assets Configuration
# https://developers.cloudflare.com/workers/static-assets/

name = "doctale"
compatibility_date = "2024-01-01"

# Static assets only, no worker script. `next build` (output: 'export') writes the site to out/.
[assets]
directory = "out"
# /foo -> /foo/ (matches next.config trailingSlash) and serve out/404.html for unknown paths.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
